<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форпост — Оставить заявку</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6a0dad 0%, #9b30a0 25%, #c45a8a 45%, #d4845a 65%, #e8a830 85%, #f0c020 100%); /* Синхронизировал с главной страницей */
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --white: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex; flex-direction: column;
            color: var(--text-dark);
        }
        
        /* Стили для логотипа (как на главной) */
        .header-logo {
            padding: 24px 40px;
            display: flex;
            align-items: flex-start;
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-badge {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 18px 10px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .logo-badge:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .logo-svg { height: 40px; width: auto; display: block; }

        .main-content {
            flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px 20px 40px;
        }
        .form-wrapper {
            background: var(--white); padding: 40px; border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            width: 100%; max-width: 480px;
        }
        .form-wrapper h2 { 
            text-align: center; margin-top: 0; margin-bottom: 30px; 
            font-size: 28px; color: var(--text-dark);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; margin-bottom: 8px; font-weight: 600; 
            font-size: 14px; color: var(--text-dark); 
        }
        .form-control {
            width: 100%; padding: 14px 16px; border: 1px solid #e5e7eb;
            border-radius: 12px; font-size: 16px; background: #f9fafb;
            transition: all 0.3s ease; box-sizing: border-box;
            font-family: inherit; color: var(--text-dark);
        }
        .form-control:focus {
            outline: none; border-color: #7b2cbf; background: white;
            box-shadow: 0 0 0 4px rgba(123, 44, 191, 0.1);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }
        select.form-control { 
            appearance: none; 
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); 
            background-repeat: no-repeat; background-position: right 1rem center; 
            background-size: 1em; cursor: pointer;
        }
        .btn-submit {
            width: 100%; background: var(--primary-gradient); color: white;
            border: none; padding: 16px; border-radius: 12px;
            font-size: 18px; font-weight: 700; cursor: pointer;
            margin-top: 10px; transition: opacity 0.3s, transform 0.2s;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
        
        @media (max-width: 480px) {
            .header-logo { padding: 20px; }
            .logo-svg { height: 34px; }
            .logo-badge { padding: 8px 14px 8px 8px; }
            .form-wrapper { padding: 25px; border-radius: 20px; }
            .form-wrapper h2 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- Скрытые градиенты для логотипа -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7C3AED"/>
                <stop offset="50%" stop-color="#A855F7"/>
                <stop offset="100%" stop-color="#F59E0B"/>
            </linearGradient>
            <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#7C3AED"/>
                <stop offset="50%" stop-color="#A855F7"/>
                <stop offset="100%" stop-color="#F59E0B"/>
            </linearGradient>
        </defs>
    </svg>

    <!-- Шапка с логотипом-ссылкой на главную -->
    <div class="header-logo">
        <a href="index.html" class="logo" title="Вернуться на главную">
            <div class="logo-badge">
                <svg class="logo-svg" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg" aria-label="Форпост SMM Агентство">
                    <g transform="translate(5, 8)">
                        <path d="M 8 8 L 18 8 L 18 42 L 8 42 Z" fill="url(#logoGrad)"/>
                        <path d="M 8 8 L 42 8 L 38 16 L 8 16 Z" fill="url(#logoGrad)"/>
                        <path d="M 18 24 L 38 24 L 35 32 L 18 32 Z" fill="url(#logoGrad)"/>
                    </g>
                    <text x="55" y="44" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">Форпост</text>
                    <text x="57" y="62" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#4C1D95" letter-spacing="1">SMM АГЕНТСТВО</text>
                </svg>
            </div>
        </a>
    </div>

    <div class="main-content">
        <div class="form-wrapper">
            <h2>Обсудить проект</h2>
            
            <form action="https://formspree.io/f/mqpanbwn" method="POST">
                <div class="form-group">
                    <label for="name">Как вас зовут?</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Иван Иванов" required>
                </div>

                <div class="form-group">
                    <label for="phone">Номер телефона</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="+7 (999) 000-00-00" required>
                </div>

                <div class="form-group">
                    <label for="service">Какая услуга интересует?</label>
                    <select id="service" name="service" class="form-control" required>
                        <option value="" disabled selected>Выберите услугу</option>
                        <option value="Контент-продакшн">Контент-продакшн</option>
                        <option value="Таргет">Таргетированная реклама</option>
                        <option value="Блогеры">Работа с блогерами</option>
                        <option value="Комьюнити">Комьюнити-менеджмент</option>
                        <option value="Аналитика">Аналитика и отчётность</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tariff">Какой тариф рассматриваете?</label>
                    <select id="tariff" name="tariff" class="form-control" required>
                        <option value="" disabled selected>Выберите тариф</option>
                        <option value="Light">Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Strong">Strong</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Комментарий (необязательно)</label>
                    <textarea id="message" name="message" class="form-control" placeholder="Расскажите о вашем проекте, задайте вопрос или опишите пожелания..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Отправить заявку</button>
            </form>
        </div>
    </div>

   <script>
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const planName = urlParams.get('plan');

    if (planName) {
        const selects = document.querySelectorAll('select');
        selects.forEach(select => {
            for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].text.toLowerCase() === planName.toLowerCase() || 
                    select.options[i].value.toLowerCase() === planName.toLowerCase()) {
                    select.selectedIndex = i;
                    select.dispatchEvent(new Event('change', { bubbles: true }));
                    break;
                }
            }
        });
    }
});
</script>
</body>
</html>
