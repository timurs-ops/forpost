<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставить заявку</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 400px; 
            margin: 50px auto; 
            padding: 20px; 
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        button { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
        }
        button:hover { 
            background-color: #218838; 
        }
    </style>
</head>
<body>

    <h2>Оставить заявку</h2>
    
    <!-- Ваша ссылка Formspree уже вставлена ниже в атрибут action -->
    <form action="https://formspree.io/f/mqpanbwn" method="POST">
        
        <label for="name">Ваше имя:</label>
        <input type="text" id="name" name="name" placeholder="Иван Иванов" required>

        <label for="phone">Номер телефона:</label>
        <input type="tel" id="phone" name="phone" placeholder="+7 (999) 999-99-99" required>

        <label for="social">Ссылка на соцсеть:</label>
        <input type="url" id="social" name="social" placeholder="https://t.me/ваш_никнейм">

        <button type="submit">Отправить заявку</button>
    </form>

</body>
</html>
