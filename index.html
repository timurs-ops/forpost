<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форпост | SMM-агентство</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="logo">ФОРПОСТ</div>
            <p class="subtitle">Ваш надежный авангард в digital-пространстве</p>
        </header>

        <form id="leadForm" class="form-card">
            <h2>Оставить заявку</h2>
            <p class="form-desc">Защитим ваш бренд и выведем его в лидеры рынка</p>

            <div class="input-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" name="name" placeholder="Иван Иванов" required>
            </div>

            <div class="input-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67" required>
            </div>

            <div class="input-group">
                <label for="task">Задача</label>
                <select id="task" name="task" required>
                    <option value="Ведение соцсетей">Ведение соцсетей (SMM)</option>
                    <option value="Таргетированная реклама">Таргетированная реклама</option>
                    <option value="Продвижение Telegram">Продвижение Telegram</option>
                    <option value="Комплексный маркетинг">Комплексный маркетинг</option>
                </select>
            </div>

            <div class="input-group">
                <label for="message">Комментарий (опционально)</label>
                <textarea id="message" name="message" rows="3" placeholder="Расскажите о вашем проекте..."></textarea>
            </div>

            <div class="buttons-group">
                <button type="button" class="btn btn-wa" data-channel="whatsapp">
                    <span>WhatsApp</span>
                </button>
                <button type="button" class="btn btn-sms" data-channel="sms">
                    <span>SMS</span>
                </button>
                <button type="button" class="btn btn-tg" data-channel="telegram">
                    <span>Telegram</span>
                </button>
            </div>
            
            <p class="privacy">Нажимая на кнопку, вы соглашаетесь с политикой конфиденциальности</p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
