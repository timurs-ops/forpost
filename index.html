<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставить заявку на услугу</title>
    <style>
        /* Современные базовые стили */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }
        h2 { 
            text-align: center; 
            margin-top: 0; 
            margin-bottom: 25px;
            color: #1f2937; 
            font-size: 24px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-size: 14px;
        }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 18px;
            box-sizing: border-box; 
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fff;
        }
        /* Эффект при клике на поле */
        input:focus, select:focus, textarea:focus {
            border-color: #4f46e5;
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        textarea {
            resize: vertical; /* Разрешить растягивать только по вертикали */
            min-height: 80px;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #4f46e5; /* Современный синий цвет */
            color: white; 
            border: none; 
            border-radius: 8px;
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover { 
            background-color: #4338ca; /* Темнее при наведении */
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Заказать услугу</h2>
        
        <!-- Форма отправляет данные на ваш Formspree -->
        <form action="https://formspree.io/f/mqpanbwn" method="POST">
            
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" name="name" placeholder="Иван Иванов" required>

            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67" required>

            <label for="service">Какая услуга вас интересует?</label>
            <select id="service" name="service" required>
                <option value="" disabled selected>Выберите услугу из списка</option>
                <!-- ИЗМЕНИТЕ НАЗВАНИЯ УСЛУГ НИЖЕ ПОД ВАШ БИЗНЕС -->
                <option value="Консультация">Продвижение аккаунта</option>
                <option value="Ремонт">Умение работать с блогерами</option>
                <option value="Доставка">Помощь в рекламе бизнеса</option>
                <option value="Монтаж">Умени радотать в SMM</option>
                <option value="Другое">Другое (укажу в комментарии)</option>
            </select>

            <label for="message">Комментарий (необязательно):</label>
            <textarea id="message" name="message" placeholder="Например: нужно сделать завтра до 18:00"></textarea>

            <button type="submit">Отправить заявку</button>
        </form>
    </div>

</body>
</html>
